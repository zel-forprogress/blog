baseURL = 'https://zel-forprogress.github.io/blog/'
locale = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'Hardy Blog'
theme = 'book'

[params]
  # 启用目录
  BookToC = true
  # 禁用黑暗模式
  DisableDarkMode = false
  # 禁用搜索
  DisableSearch = false
  # 禁用特殊首页
  DisableSpecial1stPost = false
  # 禁用搜索索引
  DisableSearchIndex = false
  # 启用章节折叠
  BookCollapse = false
  # 主题模式: auto, light, dark
  BookTheme = 'auto'
  # 显示所有栏目
  BookSection = '*'
  # 启用评论
  BookComments = false
  # 启用外部链接
  BookExtlinks = false
  # 启用搜索
  BookSearch = true
  # 日期格式
  BookDateFormat = '2006-01-02'
  # GitHub 仓库地址
  BookRepo = 'https://github.com/zel-forprogress/blog'
  # 编辑链接路径
  BookEditPath = 'edit/main'
  # 分支版本
  BookVersion = 'main'
  # 启用页面描述
  BookPageDescription = true
  # 翻译前缀
  BookTranslatedPrefix = ''
  # 警告重复页面
  BookWarnDuplicatePages = true

# 菜单配置
[[menu.main]]
  identifier = "project"
  name = "项目"
  url = "/project"
  weight = 1

[[menu.main]]
  identifier = "wendang"
  name = "文档"
  url = "/wendang"
  weight = 2

[[menu.main]]
  identifier = "daily"
  name = "日报"
  url = "/daily"
  weight = 3

[[menu.main]]
  identifier = "agent"
  name = "Agent"
  url = "/agent"
  weight = 4

[[menu.after]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/zel-forprogress/blog"
  weight = 10
  [menu.after.params]
    BookIcon = "github"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
