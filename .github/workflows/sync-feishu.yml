name: Sync Feishu Wiki to Blog

on:
  schedule:
    # 每天 UTC 15:00 = 北京时间 23:00（在 Agent 日报之前）
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SPACE_ID: ${{ secrets.FEISHU_SPACE_ID }}
          FEISHU_WIKI_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_NODE_TOKEN }}
          FEISHU_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_PARENT_NODE_TOKEN }}
        run: node scripts/sync-feishu.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ scripts/.feishu-sync-state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync from Feishu: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    runs-on: ubuntu-latest
    needs: [sync, deploy]
    if: always()
    steps:
      - name: Notify Feishu result
        env:
          FEISHU_BOT_WEBHOOK: ${{ secrets.FEISHU_BOT_WEBHOOK }}
          SYNC_RESULT: ${{ needs.sync.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$FEISHU_BOT_WEBHOOK" ]; then
            echo "FEISHU_BOT_WEBHOOK is not configured, skip notification"
            exit 0
          fi

          DEPLOY_TIME="$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"

          if [ "$SYNC_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            MSG="blob同步：博客部署成功。部署时间：$DEPLOY_TIME"
          elif [ "$SYNC_RESULT" != "success" ]; then
            MSG="blob同步：博客部署失败。部署时间：$DEPLOY_TIME。同步状态：$SYNC_RESULT。日志：$RUN_URL"
          else
            MSG="blob同步：博客部署失败。部署时间：$DEPLOY_TIME。部署状态：$DEPLOY_RESULT。日志：$RUN_URL"
          fi

          curl -sS -X POST "$FEISHU_BOT_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"$MSG\"}}"
