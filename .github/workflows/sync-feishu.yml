name: Sync Feishu Wiki to Blog

on:
  schedule:
    # 每天 UTC 15:00 = 北京时间 23:00（在 Agent 日报之前）
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync from Feishu
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_SPACE_ID: ${{ secrets.FEISHU_SPACE_ID }}
          FEISHU_WIKI_NODE_TOKEN: ${{ secrets.FEISHU_WIKI_NODE_TOKEN }}
          FEISHU_PARENT_NODE_TOKEN: ${{ secrets.FEISHU_PARENT_NODE_TOKEN }}
        run: node scripts/sync-feishu.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ scripts/.feishu-sync-state.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync from Feishu: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
